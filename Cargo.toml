[workspace]
resolver = "2"
members = ["."]

[workspace.dependencies]
shikifsrs-runtime = { git = "https://github.com/KamiyamaShiki0704/ShikiFSRS.git", rev = "930f818431e72209b49d2e37265a1f8150fa5390" }
shikifsrs-elden-ring = { git = "https://github.com/KamiyamaShiki0704/ShikiFSRS.git", rev = "930f818431e72209b49d2e37265a1f8150fa5390" }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[package]
name = "er-gparam-preload-patch"
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "gparam_preload_patch"
crate-type = ["cdylib"]

[dependencies]
shikifsrs-runtime.workspace = true
shikifsrs-elden-ring.workspace = true
windows.workspace = true

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
