[workspace]
resolver = "2"
members = ["."]

[workspace.dependencies]
fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "0b44ede3ae9d95d39bfef65edc0694380a1b83c3", package = "fromsoftware-shared" }
eldenring = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "0b44ede3ae9d95d39bfef65edc0694380a1b83c3", package = "eldenring" }
pelite = "0.10"

[workspace.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
]

[package]
name = "er-gparam-preload-patch"
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "gparam_preload_patch"
crate-type = ["cdylib"]

[dependencies]
fromsoftware-shared.workspace = true
eldenring.workspace = true
pelite.workspace = true
windows.workspace = true

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
